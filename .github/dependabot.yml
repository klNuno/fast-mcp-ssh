# Version-update PRs are parked (`open-pull-requests-limit: 0`) while the repo
# is private: each one opened a PR that ran the full CI matrix against a
# private-repo Actions quota. Security updates still come through. Raise the
# limit back to 5 / drop it to the default when the repo goes public.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      patch-and-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
