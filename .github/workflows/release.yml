name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf fast-mcp-ssh-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release fast-mcp-ssh
          shasum -a 256 fast-mcp-ssh-${{ matrix.target }}.tar.gz \
            > fast-mcp-ssh-${{ matrix.target }}.tar.gz.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/fast-mcp-ssh.exe `
            -DestinationPath fast-mcp-ssh-${{ matrix.target }}.zip
          (Get-FileHash fast-mcp-ssh-${{ matrix.target }}.zip -Algorithm SHA256).Hash `
            | Out-File fast-mcp-ssh-${{ matrix.target }}.zip.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fast-mcp-ssh-${{ matrix.target }}.tar.gz
            fast-mcp-ssh-${{ matrix.target }}.tar.gz.sha256
            fast-mcp-ssh-${{ matrix.target }}.zip
            fast-mcp-ssh-${{ matrix.target }}.zip.sha256
          fail_on_unmatched_files: false
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}

  publish:
    name: crates.io
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
