# Builds a tag and opens the release as a DRAFT. Nothing is published from
# here: `releases/latest` skips drafts, so no binary and no crate reaches
# anyone until a human has looked at the assets and pressed Publish. That press
# is what triggers `publish.yml`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs before anything is built. A tag that disagrees with Cargo.toml ships a
  # binary whose `--version` lies and a crates.io upload that can never be
  # corrected, so it fails the run instead.
  check:
    name: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Check the tag shape and the crate version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag $tag is not vMAJOR.MINOR.PATCH" && exit 1 ;;
          esac
          # `tr -d '\r'`: a manifest that reaches the runner with CRLF makes
          # every comparison below fail against an identical-looking string.
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1 | tr -d '\r')
          if [ "$crate" != "${tag#v}" ]; then
            echo "::error::Cargo.toml says $crate, the tag says ${tag#v}"
            exit 1
          fi
          # Two places in server.json, and the MCP registry refuses an entry
          # whose package version it cannot find on crates.io.
          for v in $(jq -r '.version, .packages[].version' server.json | tr -d '\r'); do
            if [ "$v" != "${tag#v}" ]; then
              echo "::error::server.json says $v, the tag says ${tag#v}"
              exit 1
            fi
          done
          # The registry caps the description at 100 characters and only says
          # so at publish time, which is after the crate is already up and a
          # version can no longer be corrected. v0.4.4 went out that way.
          desc=$(jq -r '.description' server.json | tr -d '\r')
          if [ "${#desc}" -gt 100 ]; then
            echo "::error::server.json description is ${#desc} characters, the MCP registry caps it at 100"
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, pinned 2026-07-29
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf fast-mcp-ssh-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release fast-mcp-ssh

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/fast-mcp-ssh.exe `
            -DestinationPath fast-mcp-ssh-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          if-no-files-found: error
          path: |
            fast-mcp-ssh-${{ matrix.target }}.tar.gz
            fast-mcp-ssh-${{ matrix.target }}.zip

  # One job assembles the release so the checksums cover every archive in a
  # single file. Five `.sha256` files next to five archives is ten rows on the
  # release page for one line of information.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # the notes below walk back to the previous tag

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksum every archive into one file
        run: |
          cd dist
          files=$(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ -z "$files" ]; then
            echo "::error::no archives to release"
            exit 1
          fi
          printf '%s\n' "$files" | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write the release notes
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          previous=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          {
            if [ -n "$previous" ]; then
              echo "## Changes since ${previous}"
            else
              echo "## Changes"
            fi
            echo
            git log --no-merges --format='- %s' ${previous:+"${previous}.."}"${tag}"
            cat <<'EOF'

          ## Install

          `cargo install fast-mcp-ssh`, or download the archive for your
          platform below and check it against `SHA256SUMS.txt`.
          EOF
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # Draft on purpose. Publishing is a separate, human-triggered step; see
      # the header comment and `publish.yml`.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          draft: true
