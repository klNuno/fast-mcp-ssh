[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # Marvin: timing sidechannel in RSA decryption. Reached through russh's
    # `rsa` feature, which is what makes RSA user keys and RSA host keys work
    # at all. No fixed release exists. SSH uses RSA for signatures rather than
    # decryption, and dropping the feature would lock out every user still on
    # an `id_rsa`. Re-check whenever the `rsa` crate ships a stable 0.10.
    "RUSTSEC-2023-0071",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
