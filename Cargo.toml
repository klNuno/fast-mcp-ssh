[package]
name = "fast-mcp-ssh"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Fast MCP SSH server with persistent PTY sessions, SFTP, and AI-first tool surface"
license = "MIT"
readme = "README.md"
repository = "https://github.com/klNuno/fast-mcp-ssh"
homepage = "https://github.com/klNuno/fast-mcp-ssh"
documentation = "https://docs.rs/fast-mcp-ssh"
keywords = ["mcp", "ssh", "sftp", "agent", "llm"]
categories = ["command-line-utilities", "network-programming", "development-tools"]
exclude = [
    "/benchmark",
    "/scripts",
    "/docs",
    "/.github",
    "/target-*",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
]

[[bin]]
name = "fast-mcp-ssh"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1.6", features = ["server", "macros", "transport-io", "elicitation", "schemars"] }
russh = { version = "0.60", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2.1"
ssh2-config-rs = "0.7"
tokio = { version = "1", features = ["rt", "macros", "io-util", "net", "fs", "time", "sync"] }
mimalloc = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "2"
regex = "1"
dashmap = "6"
arc-swap = "1"
dirs = "6"
shellexpand = "3"
clap = { version = "4", features = ["derive"] }
zeroize = { version = "1", features = ["derive"] }
memchr = "2"
getrandom = "0.2"
base64 = "0.22"
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
